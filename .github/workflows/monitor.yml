name: PS5 Suche

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Live suchen ohne Telegram-Nachrichten'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ps5-search
  cancel-in-progress: false

jobs:
  search:
    # Public standard runner only; never consume private-repository paid minutes.
    if: github.event.repository.visibility == 'public' && (vars.PS5_MONITOR_ENABLED == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Search and notify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = 'true' ]; then
            python3 monitor.py --dry-run
          else
            python3 monitor.py
          fi

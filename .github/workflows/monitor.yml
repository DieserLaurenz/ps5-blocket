name: PS5 Search

on:
  # cron-job.org sends this dispatch every five minutes; no second built-in timer.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Live search without Telegram messages'
        type: boolean
        default: false
      diagnose_ai:
        description: 'Check available Gemini models only (no generation)'
        type: boolean
        default: false
      preview_format:
        description: 'Send one current listing as a Telegram format preview'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ps5-search
  cancel-in-progress: false

jobs:
  search:
    # Public standard runner only; never consume private-repository paid minutes.
    if: github.event.repository.visibility == 'public' && (vars.PS5_MONITOR_ENABLED == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
        with:
          persist-credentials: false
      - name: Search and notify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRADERA_APP_ID: ${{ secrets.TRADERA_APP_ID }}
          TRADERA_APP_KEY: ${{ secrets.TRADERA_APP_KEY }}
          TRADERA_ENABLED: ${{ vars.TRADERA_ENABLED }}
          DRY_RUN: ${{ inputs.dry_run }}
          DIAGNOSE_AI: ${{ inputs.diagnose_ai }}
          PREVIEW_FORMAT: ${{ inputs.preview_format }}
        run: |
          if [ "$DIAGNOSE_AI" = 'true' ]; then
            python3 monitor.py --diagnose-ai
          elif [ "$DRY_RUN" = 'true' ]; then
            python3 monitor.py --dry-run
          elif [ "$PREVIEW_FORMAT" = 'true' ]; then
            python3 monitor.py --preview-format
          else
            python3 monitor.py
          fi

name: Hamilton Watch

on:
  schedule:
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Live prüfen ohne Telegram und Statusänderung'
        type: boolean
        default: true
      browser_profile:
        description: 'HTTP-Profil für einen gezielten Kompatibilitätstest'
        type: choice
        default: chrome124
        options:
          - chrome124
          - chrome142
      runner:
        description: 'Remote-Umgebung für einen gezielten Kompatibilitätstest'
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - windows-latest

permissions:
  contents: write

concurrency:
  group: hamilton-watch
  cancel-in-progress: false

jobs:
  check:
    if: github.event.repository.visibility == 'public' && (vars.WATCH_MONITOR_ENABLED == 'true' || inputs.dry_run == true)
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install watch HTTP client
        run: python3 -m pip install -r requirements-watch.txt
      - name: Install Chrono24 browser
        continue-on-error: true
        shell: bash
        run: |
          python3 -m pip install playwright==1.62.0
          if [ "$RUNNER_OS" = 'Linux' ]; then
            python3 -m playwright install --with-deps chromium
          else
            python3 -m playwright install chromium
          fi
      - name: Read Chrono24 without notification secrets
        continue-on-error: true
        timeout-minutes: 5
        shell: bash
        run: |
          if [ "$RUNNER_OS" = 'Linux' ]; then
            xvfb-run --auto-servernum python3 watch_chrono_browser.py
          else
            python3 watch_chrono_browser.py
          fi
      - name: Check watch offers
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          WATCH_BROWSER_PROFILE: ${{ inputs.browser_profile || 'chrome124' }}
        run: |
          if [ "$DRY_RUN" = 'true' ]; then
            python3 watch_monitor.py --chrono-snapshot output/chrono-browser.json --dry-run
          else
            python3 watch_monitor.py --chrono-snapshot output/chrono-browser.json
          fi

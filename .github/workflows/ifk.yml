name: IFK Tickets

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check live IFK sources without Telegram messages or state changes'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ifk-tickets
  cancel-in-progress: false

jobs:
  check:
    if: github.event.repository.visibility == 'public' && vars.IFK_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check IFK tickets and notify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = 'true' ]; then
            python3 ifk_monitor.py --dry-run
          else
            python3 ifk_monitor.py
          fi
